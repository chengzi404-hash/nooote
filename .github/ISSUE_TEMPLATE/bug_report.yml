name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 Issue，避免重复。
        安全漏洞请勿在此公开，请按仓库中 SECURITY.md 说明的方式私密报告。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
      placeholder: 简洁描述问题，必要时附上截图或录屏。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 /console 并新建笔记
        2. 在编辑区输入 ...
        3. 公开笔记后访问 /share/<id>
        4. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: input
    id: note-id
    attributes:
      label: 笔记 ID（如相关）
      description: 仅公开笔记可被他人访问，请勿在示例中包含敏感内容。
      placeholder: demo

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 运行 `git rev-parse --short HEAD`，或说明使用的版本。
      placeholder: 0.1.0 / a1b2c3d

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python 与 uv 版本、浏览器及版本。
      placeholder: Windows 11 / Python 3.12 / uv 0.9 / Chrome 141
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或错误信息
      description: 终端输出、浏览器控制台报错等。请先移除敏感信息。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有找到相同问题
          required: true
        - label: 这不是安全漏洞（安全漏洞请按 SECURITY.md 私密报告）
          required: true
