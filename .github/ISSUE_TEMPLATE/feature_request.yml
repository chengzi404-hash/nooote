name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请先搜索已有 Issue，确认没有重复建议。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个建议解决了什么痛点？在什么场景下会遇到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如果有界面或交互上的想法，可以描述或画出来。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或者现有的替代方式。

  - type: dropdown
    id: area
    attributes:
      label: 涉及的模块
      options:
        - 编辑与自动保存
        - Markdown 预览
        - 代码高亮与静态检查
        - Mermaid / KaTeX
        - 首页与导航
        - 部署与配置
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有找到相同建议
          required: true
