[project]
name = "nooote"
version = "0.1.0"
description = "A minimal online CommonMark notes app in the spirit of note.ms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.1",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
